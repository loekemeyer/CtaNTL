<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta Corriente NTL</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">₦</span>
    <div>
      <h1>Cuenta Corriente NTL</h1>
      <p class="sub">Gestor de cuentas corrientes · datos compartidos en Supabase</p>
    </div>
  </div>
  <div class="topbar-actions">
    <span id="conn-status" class="pill pill-wait" title="Estado de conexión">Conectando…</span>
    <button id="btn-clave" class="btn ghost" title="Habilitar edición con la clave">🔒 Editar</button>
    <button id="btn-export-json" class="btn ghost" title="Descargar una copia de seguridad de todos los datos">⬇ Backup</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="main"></main>

<!-- Modal edicion movimiento / pendiente -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modal-title">Nuevo movimiento</h3>
      <button class="modal-x" id="modal-close">✕</button>
    </div>
    <form id="modal-form" class="modal-body"></form>
    <div class="modal-foot">
      <button type="button" class="btn ghost" id="modal-cancel">Cancelar</button>
      <button type="submit" form="modal-form" class="btn primary">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal clave -->
<div class="modal-backdrop" id="clave-backdrop" hidden>
  <div class="modal" style="max-width:400px" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="clave-title">Ingresá la clave para editar</h3>
      <button class="modal-x" id="clave-close">✕</button>
    </div>
    <form id="clave-form" class="modal-body" style="grid-template-columns:1fr">
      <div class="field full">
        <label id="clave-label">Clave</label>
        <input type="password" id="clave-input" autocomplete="off" placeholder="••••••">
      </div>
      <div class="field full" id="clave-nueva-wrap" hidden>
        <label>Nueva clave (mín. 4)</label>
        <input type="password" id="clave-nueva" autocomplete="off" placeholder="Nueva clave">
      </div>
      <p id="clave-error" class="clave-error" hidden></p>
    </form>
    <div class="modal-foot">
      <button type="button" class="btn ghost" id="clave-change-toggle" title="Cambiar la clave">Cambiar clave</button>
      <div style="flex:1"></div>
      <button type="button" class="btn ghost" id="clave-cancel">Cancelar</button>
      <button type="submit" form="clave-form" class="btn primary" id="clave-submit">Desbloquear</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
